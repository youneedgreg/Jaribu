name: Sweep

# Deletes shoppers' previews older than 24 hours. Vercel Hobby crons run at most once a day, so
# this is the hourly one; vercel.json has the daily backup. Needs the CRON_SECRET repo secret.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Call the sweep route
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: >
          curl --fail-with-body --silent --show-error --max-time 300 --retry 2
          -H "Authorization: Bearer $CRON_SECRET"
          https://tryjaribu.vercel.app/api/cron/sweep
